<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Roster Landing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h1 class="display-5 mb-3">Club Enrollment Hub</h1>
            <p class="lead mb-4">Collect student club preferences and build a live roster in just a few clicks.</p>
            <button id="startBtn" type="button" class="btn btn-primary btn-lg">Start</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var startBtn = document.getElementById('startBtn');
      if (startBtn) {
        startBtn.addEventListener('click', function () {
          window.location.href = 'enroll.html';
        });
      }
    })();
  </script>
</body>
</html>
